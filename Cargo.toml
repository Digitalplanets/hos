[package]
name = "hos"
version = "0.0.1"
edition = "2021"
description = "HOS — a from-scratch local LLM inference engine"
license = "MIT"

[[bin]]
name = "hos"
path = "src/main.rs"

# flwr — the chat app built on top of the hos engine library (Ollama-style).
# The front-end, powered by hos. Separate binary; it does not affect the `hos`
# engine command.
[[bin]]
name = "flwr"
path = "src/bin/flwr/main.rs"

[dependencies]
memmap2 = "0.9"
half = "2"
rayon = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Metal is Apple-only: the GPU backend compiles on macOS, and the engine builds
# CPU-only everywhere else (Windows/Linux/WASM). Keeps the Mac build identical.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
