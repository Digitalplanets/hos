[package]
name = "hos-python"
version = "0.0.1"
edition = "2021"
description = "Python bindings for the HOS engine"

[lib]
name = "hos"
crate-type = ["cdylib"]

[dependencies]
# aliased: the cdylib itself is named `hos`, so the engine dep is `hos_engine`
hos_engine = { package = "hos", path = ".." }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
