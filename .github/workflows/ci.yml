name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # HOS builds CPU-only on Linux (the `metal` GPU dependency is macOS-gated),
    # so CI runs on GitHub's free Linux runners. Tests that need a GPU device or
    # model files self-skip when those are absent, so they pass on a clean runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test
